# Nginx Groupe Bama GED — écoute en HTTP:80, le TLS est fait par le reverse proxy de l'hôte.
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Uploads de documents (aligné sur upload_max_filesize=150M de PHP)
    client_max_body_size 160M;
    client_body_timeout 300s;

    # DNS interne Docker : l'IP de grpbama_app est re-résolue après chaque recréation du conteneur.
    # Nom de conteneur UNIQUE (pas « app ») : le réseau db_mysql_mynetwork est partagé avec Notaris.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream grpbama_app:9000;

    # Fichiers cachés (.env, .git…) — sauf .well-known
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Assets Vite versionnés (pas d'add_header ici : il masquerait les en-têtes de sécurité du server)
    location /build/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_request_buffering off;
    }

    # Aucun autre script PHP exécutable
    location ~ \.php$ {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
