; Pool PHP-FPM — VPS partagé avec Notaris (pm.max_children=50 de son côté) : on reste sobre.
; Chaque conversion LibreOffice / OCR tourne dans la file d'attente, pas dans FPM.
[www]
listen = 9000
pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
request_terminate_timeout = 300s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
