services:

  # ─────────────────────────────────────────────────────────────
  #  APPLICATION Laravel / PHP-FPM
  # ─────────────────────────────────────────────────────────────
  app:
    image: imperissoft/grpbama:latest
    restart: unless-stopped
    user: root
    working_dir: /var/www
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      - APP_NAME=Groupe Bama
      - APP_ENV=production
      - APP_KEY=base64:giZ9L2WKCeJlJ/MazMA3C3TCozQtL+sIgZyEZd+LeaY=
      - APP_DEBUG=false
      - APP_URL=https://groupe-bama-ged.imperis.com
      - APP_LOCALE=fr
      - APP_FALLBACK_LOCALE=fr
      - APP_FAKER_LOCALE=fr_FR
      - APP_MAINTENANCE_DRIVER=file
      - BCRYPT_ROUNDS=12
      - LOG_CHANNEL=stack
      - LOG_DEPRECATIONS_CHANNEL=null
      - LOG_LEVEL=error

      # ✅ PostgreSQL — connexion interne Docker
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=groupebama
      - DB_USERNAME=grpbama
      - DB_PASSWORD=dbimperis123@78

      # ✅ Sessions
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - SESSION_ENCRYPT=false
      - SESSION_PATH=/
      - SESSION_DOMAIN=groupe-bama-ged.imperis.com
      - SESSION_SECURE_COOKIE=true
      - SESSION_SAME_SITE=lax

      - BROADCAST_CONNECTION=log

      # ✅ MinIO sur le QNAP TS-433 (réseau local)
      - FILESYSTEM_DISK=minio
      - AWS_ACCESS_KEY_ID=idADMIN
      - AWS_SECRET_ACCESS_KEY=idADMIN78
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=groupebama
      # Remplacer <IP_QNAP> par l'IP locale du QNAP TS-433 (ex: 192.168.1.20)
      - AWS_URL=http://<IP_QNAP>:9000
      - AWS_ENDPOINT=http://<IP_QNAP>:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true

      # ✅ Queue et cache
      - QUEUE_CONNECTION=sync
      - CACHE_STORE=file
      - CACHE_DRIVER=file

      - MAIL_MAILER=log
      - MAIL_FROM_ADDRESS=infos@groupe-bama-ged.imperis.com
      - MAIL_FROM_NAME=Groupe Bama

      - VITE_APP_NAME=Groupe Bama

    volumes:
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
      - public_assets:/var/www/public

    networks:
      - laravel_network

    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q 'test is successful' && echo ok || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  #  NGINX — Reverse proxy / serveur web
  # ─────────────────────────────────────────────────────────────
  web:
    image: nginx:1.25-alpine
    container_name: grpbama_nginx
    restart: unless-stopped
    ports:
      - "8786:80"
    volumes:
      - public_assets:/var/www/public:ro
      - /root/grpbama/docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel_network

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  #  POSTGRESQL — Base de données
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: grpbama_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=groupebama
      - POSTGRES_USER=grpbama
      - POSTGRES_PASSWORD=dbimperis123@78
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laravel_network
    ports:
      # Exposé uniquement en local pour maintenance (ne pas exposer en prod publique)
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grpbama -d groupebama"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ─────────────────────────────────────────────────────────────
#  VOLUMES
# ─────────────────────────────────────────────────────────────
volumes:
  storage_data:
  cache_data:
  public_assets:
  postgres_data:
    driver: local

# ─────────────────────────────────────────────────────────────
#  RÉSEAUX
# ─────────────────────────────────────────────────────────────
networks:
  laravel_network:
    driver: bridge
